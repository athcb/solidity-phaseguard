name: CI

permissions: {}

on:
  push:
    branches: [main, phaseguard-testsuite]
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Build, Format & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Check formatting
        run: forge fmt --check

      - name: Build (with contract sizes)
        run: forge build --sizes

      - name: Run tests
        run: forge test -vvv

      - name: Run gas snapshot
        run: forge snapshot --mc GasBenchmark --snap .gas-benchmark --check || true

      - name: Run coverage
        run: forge coverage --no-match-coverage "^(test|script|lib)/"
