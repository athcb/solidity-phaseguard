[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"

remappings = ["@openzeppelin/=lib/openzeppelin-contracts/contracts/"]

# Exclude test mocks, helpers, and libraries from coverage reports.
no_match_coverage = "^(test|script|lib)/"

[profile.ci]
fuzz.runs = 256
verbosity = 2

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
